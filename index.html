<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora CMV - Bar & Restaurante</title>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-dark: #0b0f19;       /* Fundo principal azul-escuro profundo */
            --card-bg: #161e2e;       /* Fundo dos painéis em azul-marinho */
            --input-bg: #0b0f19;      /* Fundo dos inputs em azul-escuro profundo */
            --accent: #38bdf8;        /* Azul Celeste/Ciano claro vibrante */
            --accent-hover: #7dd3fc;  /* Azul celeste mais claro */
            --text-main: #ffffff;     /* Branco puro para textos principais */
            --text-muted: #94a3b8;    /* Slate 400 para labels */
            --border: #243048;        /* Azul-marinho cinzento para bordas */
            --danger: #f87171;        /* Vermelho pastel */
            --success: #34d399;       /* Verde pastel */
            --info: #38bdf8;          /* Azul celeste */
            --hover-bg: #1e293b;      /* Slate 800 para hover nas abas */
            --th-bg: #0f172a;         /* Fundo do header em azul-escuro */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tabs-nav {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid var(--border);
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-btn {
            border: none;
            background: none;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--accent);
            background-color: transparent;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            background-color: transparent;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(148, 163, 184, 0.08), 0 4px 10px -2px rgba(148, 163, 184, 0.04);
        }

        .card-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .card-header-actions h2 {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        h2 {
            color: var(--text-main);
            font-weight: 700;
            margin-bottom: 20px;
            font-size: 1.4rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input, select {
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        button {
            background-color: var(--accent);
            color: #0b0f19;
            font-weight: 600;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-secondary {
            background-color: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            padding: 6px 12px;
            font-size: 0.85rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .btn-secondary:hover {
            background-color: #334155;
            color: #ffffff;
            border-color: #475569;
        }

        .btn-success {
            background-color: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px 12px;
            font-size: 0.85rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.02);
        }

        .btn-success:hover {
            background-color: rgba(56, 189, 248, 0.25);
            color: #7dd3fc;
            border-color: rgba(56, 189, 248, 0.5);
        }

        .btn-danger {
            background-color: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px 10px;
            font-size: 0.8rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.02);
            border-radius: 6px;
        }

        .btn-danger:hover {
            background-color: rgba(56, 189, 248, 0.25);
            color: #7dd3fc;
            border-color: rgba(56, 189, 248, 0.5);
        }

        .btn-edit {
            background-color: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px 10px;
            font-size: 0.8rem;
            margin-right: 4px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.02);
            border-radius: 6px;
        }

        .btn-edit:hover {
            background-color: rgba(56, 189, 248, 0.25);
            color: #7dd3fc;
            border-color: rgba(56, 189, 248, 0.5);
        }

        .actions-group {
            display: flex;
            gap: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        th, td {
            border-bottom: 1px solid var(--border);
            padding: 12px 10px;
            text-align: left;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            background-color: var(--th-bg);
        }

        .summary-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
            background-color: var(--bg-dark);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .summary-item {
            display: flex;
            flex-direction: column;
        }

        .summary-item .value {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent);
            margin-top: 4px;
        }

        .drink-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px -3px rgba(148, 163, 184, 0.06), 0 2px 6px -2px rgba(148, 163, 184, 0.04);
        }

        .drink-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .drink-title {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .drink-metrics {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .drink-metrics span strong {
            color: var(--text-main);
        }

        .empty-msg {
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
            padding: 30px 0;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 750px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 1.3rem;
            margin-bottom: 0;
            color: var(--text-main);
            font-weight: bold;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .input-qtde {
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 8px;
            border-radius: 6px;
            width: 75px;
            text-align: center;
            font-size: 0.9rem;
        }

        .modal-add-box {
            background-color: var(--bg-dark);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }

        .modal-add-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            background-color: var(--card-bg);
            flex-shrink: 0;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 0;
        }

        .btn-salvar {
            background-color: var(--accent);
            color: #0b0f19;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
            transition: all 0.2s ease;
        }

        .btn-salvar:hover {
            background-color: var(--accent-hover);
        }

        .btn-cancelar {
            background-color: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-cancelar:hover {
            background-color: #334155;
            color: #ffffff;
            border-color: #475569;
        }

        .supplier-box {
            background-color: var(--bg-dark);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .supplier-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .tag-max {
            background-color: rgba(239, 68, 68, 0.12);
            color: var(--danger);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 5px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .tag-min {
            background-color: rgba(16, 185, 129, 0.12);
            color: var(--success);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 5px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .mobile-only-label {
            display: none;
        }

        .supplier-row .f-group {
            display: contents;
        }

        .card-header {
            margin-bottom: 20px;
        }

        .card-footer {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }

        /* ESTILOS DE RESPONSIVIDADE (MOBILE / ANDROID / IOS) */
        @media (max-width: 768px) {
            body {
                padding: 0 0 80px 0;
            }

            .container {
                padding: 0;
                gap: 0;
                width: 100%;
                max-width: 100%;
            }

            .card {
                border-radius: 0;
                border: none;
                box-shadow: none;
                padding: 24px 16px;
                min-height: calc(100vh - 65px);
                margin: 0;
            }

            /* 1. Barra de Navegação no Rodapé (Estilo App Nativo) */
            .tabs-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background-color: var(--card-bg);
                border-top: 1px solid var(--border);
                display: flex;
                justify-content: space-around;
                padding: 8px 0;
                margin-bottom: 0;
                z-index: 1000;
                height: 65px;
                box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
            }

            .tab-btn {
                flex: 1;
                border: none;
                background: none;
                color: var(--text-muted);
                font-size: 0.7rem;
                padding: 4px 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2px;
                border-radius: 0;
                border-bottom: none !important;
            }

            .tab-btn span {
                font-size: 1.3rem;
                margin-bottom: 2px;
            }

            .tab-btn:hover {
                background-color: transparent;
                color: var(--accent);
            }

            .tab-btn.active {
                background-color: transparent;
                color: var(--accent);
                border-bottom: none !important;
                font-weight: 700;
            }

            /* 2. Grid de Formulários */
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .form-group[style*="grid-column"] {
                grid-column: span 1 !important;
            }

            /* 3. Inputs Dinâmicos de Fornecedores */
            .mobile-only-label {
                display: block;
                font-size: 0.75rem;
                font-weight: 600;
                color: var(--text-muted);
                margin-bottom: 4px;
            }

            .supplier-row .f-group {
                display: flex;
                flex-direction: column;
                margin-bottom: 12px;
            }

            .supplier-box .supplier-row {
                flex-direction: column;
                align-items: stretch;
                background-color: rgba(255, 255, 255, 0.02);
                padding: 16px;
                border-radius: 12px;
                border: 1px solid var(--border);
                position: relative;
                margin-bottom: 16px;
            }

            .supplier-box .supplier-row input {
                width: 100%;
                box-sizing: border-box;
            }

            .supplier-box .supplier-row .remover-fornecedor-btn {
                align-self: stretch;
                margin-top: 5px;
                width: 100%;
                text-align: center;
                padding: 10px;
                border-radius: 8px;
            }

            /* Ocultar cabeçalhos dinâmicos em telas pequenas, pois os inputs viram blocos */
            .supplier-box div[style*="display: flex; gap: 10px; margin-bottom: 6px;"] {
                display: none !important;
            }

            /* 4. Tabelas Responsivas em Formato de Cards */
            table, thead, tbody, th, td, tr {
                display: block;
            }

            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }

            tr {
                border: 1px solid var(--border);
                border-radius: 8px;
                margin-bottom: 12px;
                padding: 12px;
                background-color: rgba(255, 255, 255, 0.01);
            }

            td {
                border: none;
                position: relative;
                padding-left: 45%;
                text-align: right;
                padding-top: 8px;
                padding-bottom: 8px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                font-size: 0.9rem;
            }

            td:last-child {
                border-bottom: none;
            }

            td::before {
                position: absolute;
                top: 8px;
                left: 10px;
                width: 40%;
                padding-right: 10px;
                white-space: nowrap;
                text-align: left;
                font-weight: bold;
                color: var(--text-muted);
                content: attr(data-label);
            }

            /* 5. Ações da Tabela */
            td button {
                width: 48%;
                margin: 1%;
                font-size: 0.85rem;
                padding: 8px 4px;
            }

            /* 6. Modais de Criação de Drinque */
            .modal-content {
                width: 95% !important;
                max-height: 95vh !important;
                border-radius: 12px;
            }

            .modal-header {
                padding: 16px 20px;
            }

            .modal-body {
                padding: 16px 20px;
            }

            .modal-footer {
                padding: 12px 20px;
            }

            .summary-box {
                flex-direction: column;
                gap: 8px;
            }

            .card-flex {
                display: flex;
                flex-direction: column;
                height: calc(100vh - 65px);
                max-height: calc(100vh - 65px);
                overflow: hidden;
            }
            .card-form-flex {
                display: flex;
                flex-direction: column;
                flex-grow: 1;
                overflow: hidden;
            }
            .card-header {
                padding-bottom: 12px;
                border-bottom: 1px solid var(--border);
                margin-bottom: 16px;
                flex-shrink: 0;
            }
            .card-body {
                overflow-y: auto;
                flex-grow: 1;
                margin-bottom: 12px;
            }
            .card-footer {
                padding: 12px 0;
                border-top: 1px solid var(--border);
                margin-top: 0;
                flex-shrink: 0;
                background-color: var(--card-bg);
            }
        }
    </style>
</head>
<body>

<!-- TELA DE LOGIN / AUTENTICAÇÃO -->
<div id="auth-screen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-dark); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; overflow-y: auto; padding: 20px 0;">
    <div class="card" style="width: 100%; max-width: 400px; padding: 30px;">
        <div style="text-align: center; font-size: 2.5rem; margin-bottom: 10px;">🍹</div>
        <h2 style="text-align: center; margin-bottom: 20px; color: var(--text-main);">Calculadora CMV</h2>
        
        <div class="tabs-nav" style="margin-bottom: 20px; border-radius: 8px; overflow: hidden; display: flex;">
            <button class="tab-btn active" id="tab-btn-login" style="flex:1; border-radius: 0;" onclick="toggleAuthMode('login')">Entrar</button>
            <button class="tab-btn" id="tab-btn-signup" style="flex:1; border-radius: 0;" onclick="toggleAuthMode('signup')">Cadastrar</button>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <div id="form-login-view">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="login-email" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <div style="display: flex; gap: 5px;">
                    <input type="password" id="login-password" placeholder="Sua senha" style="flex: 1;">
                    <button type="button" class="btn-secondary" onclick="togglePasswordVisibility('login-password', this)" style="padding: 0 15px; color: var(--text-muted);">
                        <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>
            </div>
            <button class="btn-salvar" id="btn-do-login" style="width: 100%; margin-top: 10px; padding: 12px; font-size: 1rem;">Entrar</button>
        </div>

        <!-- FORMULÁRIO DE CADASTRO -->
        <div id="form-signup-view" style="display: none;">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="signup-name" placeholder="Seu nome">
            </div>
            <div class="form-group">
                <label>Celular (WhatsApp)</label>
                <input type="tel" id="signup-phone" placeholder="(11) 99999-9999">
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="signup-email" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>Criar Senha</label>
                <div style="display: flex; gap: 5px;">
                    <input type="password" id="signup-password" placeholder="Nova senha" style="flex: 1;">
                    <button type="button" class="btn-secondary" onclick="togglePasswordVisibility('signup-password', this)" style="padding: 0 15px; color: var(--text-muted);">
                        <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label>Confirmar Senha</label>
                <div style="display: flex; gap: 5px;">

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB6LNd8p1tuZ4Ed1UXDFK1y6fAeuArI0Fo",
        authDomain: "calculador-cmv.firebaseapp.com",
        databaseURL: "https://calculador-cmv-default-rtdb.firebaseio.com",
        projectId: "calculador-cmv",
        storageBucket: "calculador-cmv.firebasestorage.app",
        messagingSenderId: "417496829167",
        appId: "1:417496829167:web:5257d462429f77fcb89f1a"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;

    let insumos = [];
    let drinques = [];
    let receitaAtual = [];

    // --- AUTENTICAÇÃO E TELA ---
    function toggleAuthMode(mode) {
        if (mode === 'login') {
            document.getElementById('form-login-view').style.display = 'block';
            document.getElementById('form-signup-view').style.display = 'none';
            document.getElementById('tab-btn-login').classList.add('active');
            document.getElementById('tab-btn-signup').classList.remove('active');
        } else {
            document.getElementById('form-login-view').style.display = 'none';
            document.getElementById('form-signup-view').style.display = 'block';
            document.getElementById('tab-btn-login').classList.remove('active');
            document.getElementById('tab-btn-signup').classList.add('active');
        }
    }

    const svgEye = '<svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    const svgEyeOff = '<svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            btn.innerHTML = svgEye;
        } else {
            input.type = "password";
            btn.innerHTML = svgEyeOff;
        }
    }

    auth.onAuthStateChanged(user => {
        const authScreen = document.getElementById('auth-screen');
        if (user) {
            if (!user.emailVerified) {
                mostrarNotificacao('Por favor, verifique seu e-mail antes de acessar.', 'danger');
                auth.signOut();
                return;
            }
            currentUser = user;
            authScreen.style.display = 'none';
            carregarDadosNuvem(); // Carrega do Firestore
        } else {
            currentUser = null;
            authScreen.style.display = 'flex';
            insumos = [];
            drinques = [];
            renderInsumos();
            renderDrinquesSalvos();
        }
    });

    // TRADUTOR DE ERROS DO FIREBASE
    function traduzirErroAuth(codigo) {
        switch (codigo) {
            case 'auth/email-already-in-use': return 'Este e-mail já está cadastrado. Vá na aba Entrar.';
            case 'auth/invalid-email': return 'Formato de e-mail inválido.';
            case 'auth/weak-password': return 'A senha é muito fraca (mínimo de 6 caracteres).';
            case 'auth/user-not-found': return 'Nenhuma conta encontrada com este e-mail.';
            case 'auth/wrong-password': return 'Senha incorreta.';
            case 'auth/invalid-credential': return 'E-mail ou senha incorretos.';
            case 'auth/too-many-requests': return 'Muitas tentativas falhas. Tente novamente mais tarde.';
            default: return 'Ocorreu um erro inesperado. Tente novamente.';
        }
    }

    document.getElementById('btn-do-login').addEventListener('click', async () => {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-password').value;
        if (!email || !pass) {
            mostrarNotificacao('Preencha e-mail e senha!', 'danger');
            return;
        }
        try {
            await auth.signInWithEmailAndPassword(email, pass);
        } catch (e) {
            mostrarNotificacao(traduzirErroAuth(e.code), 'danger');
        }
    });

    document.getElementById('btn-do-signup').addEventListener('click', async () => {
        const name = document.getElementById('signup-name').value.trim();
        const phone = document.getElementById('signup-phone').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const pass = document.getElementById('signup-password').value;
        const confirmPass = document.getElementById('signup-confirm-password').value;

        if (!name || !phone || !email || !pass) {
            mostrarNotificacao('Preencha todos os campos!', 'danger');
            return;
        }
        if (pass !== confirmPass) {
            mostrarNotificacao('As senhas não coincidem!', 'danger');
            return;
        }

        try {
            const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
            const user = userCredential.user;
            
            await user.updateProfile({ displayName: name });
            
            await db.collection('users').doc(user.uid).set({
                nome: name,
                telefone: phone,
                email: email,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            await user.sendEmailVerification();
            mostrarNotificacao('Conta criada! Verifique seu e-mail para confirmar.', 'success');
            
            await auth.signOut();
            toggleAuthMode('login');
        } catch (e) {
            mostrarNotificacao(traduzirErroAuth(e.code), 'danger');
        }
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
        auth.signOut();
    });

    // MODAL DE CONFIRMAÇÃO PERSONALIZADO
    function confirmar(mensagem, callbackSim) {
        const overlay = document.getElementById('modal-confirmar');
        document.getElementById('confirmar-mensagem').textContent = mensagem;
        overlay.classList.add('active');

        const btnSim = document.getElementById('confirmar-sim');
        const btnNao = document.getElementById('confirmar-nao');

        const fechar = () => {
            overlay.classList.remove('active');
            btnSim.onclick = null;
            btnNao.onclick = null;
        };

        btnSim.onclick = () => { fechar(); callbackSim(); };
        btnNao.onclick = () => fechar();
    }

    async function carregarDadosNuvem() {
        if (!currentUser) return;

        try {
            const docRef = db.collection('users').doc(currentUser.uid);
            const docSnap = await docRef.get();

            if (docSnap.exists) {
                const data = docSnap.data();
                insumos = data.insumos || [];
                drinques = data.drinques || [];
                mostrarNotificacao('Dados carregados da nuvem!');
            } else {
                // Primeira vez do usuário? Se ele tiver algo no localStorage, fazemos a migração.
                const localInsumos = JSON.parse(localStorage.getItem('insumos_db')) || [];
                const localDrinques = JSON.parse(localStorage.getItem('drinques_db')) || [];
                
                if (localInsumos.length > 0 || localDrinques.length > 0) {
                    insumos = localInsumos;
                    drinques = localDrinques;
                    await salvarStorage(); // Salva na nuvem
                    mostrarNotificacao('Dados locais salvos na sua nova conta na nuvem!');
                } else {
                    insumos = [];
                    drinques = [];
                }
            }
        } catch (err) {
            console.error('Erro ao carregar do Firestore:', err);
            mostrarNotificacao('Erro de conexão. Verifique sua internet.', 'danger');
        }

        renderInsumos();
        atualizarSelectInsumos();
        renderDrinquesSalvos();
        calcularTotais();
    }

    // EXIBE UMA NOTIFICAÇÃO FLUTUANTE (TOAST)
    function mostrarNotificacao(mensagem, tipo = 'success') {
        const toast = document.getElementById('toast');
        if (!toast) return;

        toast.innerText = mensagem;
        toast.style.backgroundColor = 'rgba(22, 30, 46, 0.95)';
        toast.style.color = tipo === 'danger' ? '#f87171' : '#38bdf8';
        toast.style.borderColor = tipo === 'danger' ? 'rgba(239, 68, 68, 0.4)' : 'rgba(56, 189, 248, 0.4)';

        toast.style.display = 'block';
        toast.offsetHeight; // Force reflow
        toast.style.opacity = '1';
        toast.style.transform = 'translate(-50%, 10px)';

        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translate(-50%, -10px)';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 250);
        }, 1500);
    }

    // HELPER: OBTÉM DADOS DO MAIOR PREÇO DE UM INSUMO
    function obterMaiorPrecoInsumo(insumo) {
        if (!insumo || !insumo.fornecedores || insumo.fornecedores.length === 0) {
            return { preco: 0, qtd: 1, custoUnit: 0, nomeFornecedor: 'Nenhum' };
        }

        let maior = insumo.fornecedores[0];
        const precoAtivoInicial = (maior.precoPromo !== undefined && maior.precoPromo !== null && maior.precoPromo > 0) ? maior.precoPromo : (maior.preco || 0);
        let maiorCustoUnit = precoAtivoInicial / (maior.qtd || 1);

        insumo.fornecedores.forEach(f => {
            const precoAtivo = (f.precoPromo !== undefined && f.precoPromo !== null && f.precoPromo > 0) ? f.precoPromo : (f.preco || 0);
            const custoUnit = precoAtivo / (f.qtd || 1);
            if (custoUnit > maiorCustoUnit) {
                maiorCustoUnit = custoUnit;
                maior = f;
            }
        });

        const precoFinal = (maior.precoPromo !== undefined && maior.precoPromo !== null && maior.precoPromo > 0) ? maior.precoPromo : (maior.preco || 0);

        return {
            preco: precoFinal,
            qtd: maior.qtd,
            custoUnit: maiorCustoUnit,
            nomeFornecedor: maior.nome
        };
    }

    // CONVERTE DATA DD/MM/AAAA PARA YYYY-MM-DD (REQUISITO DO INPUT TYPE="DATE")
    function formatarDataParaInput(dataStr) {
        if (!dataStr) return '';
        if (dataStr.includes('-')) {
            return dataStr.split('T')[0];
        }
        if (dataStr.includes('/')) {
            const partes = dataStr.split('/');
            if (partes.length === 3) {
                const dia = partes[0].toString().padStart(2, '0');
                const mes = partes[1].toString().padStart(2, '0');
                const ano = partes[2];
                return `${ano}-${mes}-${dia}`;
            }
        }
        return dataStr;
    }

    // CONVERTE QUALQUER FORMATO PARA O PADRÃO BRASILEIRO DD/MM/AAAA
    function formatarDataParaExibicao(dataStr) {
        if (!dataStr) return '';
        if (dataStr.includes('/')) {
            return dataStr;
        }
        if (dataStr.includes('-')) {
            const limpaTimezone = dataStr.split('T')[0];
            const partes = limpaTimezone.split('-');
            if (partes.length === 3) {
                return `${partes[2]}/${partes[1]}/${partes[0]}`;
            }
        }
        return dataStr;
    }

    function obterPrioridadeInsumo(nomeInsumo) {
        const nome = (nomeInsumo || '')
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");

        // 1. Destilados
        const spirits = ['cachaca', 'gin', 'vodka', 'rum', 'whisky', 'whiskey', 'bourbon', 'scotch', 'tequila', 'mezcal', 'brandy', 'cognac', 'pisco', 'aguardente', 'grappa', 'singani', 'calvados'];
        if (spirits.some(s => nome.includes(s))) return 1;

        // 2. Modificadores e Licores
        const modificadores = ['licor', 'vermute', 'vermouth', 'bitter', 'aperitivo', 'campari', 'aperol', 'amaro', 'cointreau', 'triple sec', 'curacao', 'st germain', 'absinto', 'sherry', 'jerez', 'porto'];
        if (modificadores.some(m => nome.includes(m))) return 2;

        // 3. Frutas, Sucos e Ervas (inclui limão, hortelã, manjericão, etc.)
        const acidosFrutas = ['limao', 'laranja', 'maracuja', 'abacaxi', 'suco', 'polpa', 'morango', 'fruta', 'framboesa', 'amora', 'mirtilo', 'grapefruit', 'toranja', 'hortela', 'manjericao', 'alecrim', 'mint', 'basil', 'rosemary', 'folha', 'especiaria', 'canela', 'cravo'];
        if (acidosFrutas.some(f => nome.includes(f))) return 3;

        // 4. Adoçantes e Xaropes
        const adocantes = ['xarope', 'acucar', 'aucar', 'sugar', 'mel', 'agave', 'pure', 'melado', 'stevia', 'simple syrup'];
        if (adocantes.some(a => nome.includes(a))) return 4;

        // 5. Bebidas com gás e Diluentes
        const gasosas = ['agua', 'tonica', 'soda', 'refrigerante', 'refri', 'gas', 'ginger', 'cola', 'club soda', 'sprite', 'schweppes'];
        if (gasosas.some(g => nome.includes(g))) return 5;

        // 6. Gelo
        if (nome.includes('gelo') || nome.includes('ice')) return 6;

        // 7. Outros
        return 7;
    }

    // Ordena um array de objetos insumos (com propriedade .nome)
    function ordenarInsumos(lista) {
        return lista.sort((a, b) => {
            const pA = obterPrioridadeInsumo(a.nome);
            const pB = obterPrioridadeInsumo(b.nome);

            if (pA !== pB) {
                return pA - pB;
            }

            return a.nome.localeCompare(b.nome, 'pt-BR');
        });
    }

    // Ordena a lista de itens da receita (com propriedade .insumoId)
    function ordenarListaReceita(lista) {
        return lista.sort((a, b) => {
            const insumoA = insumos.find(i => i.id === a.insumoId);
            const insumoB = insumos.find(i => i.id === b.insumoId);

            const pA = insumoA ? obterPrioridadeInsumo(insumoA.nome) : 99;
            const pB = insumoB ? obterPrioridadeInsumo(insumoB.nome) : 99;

            if (pA !== pB) {
                return pA - pB;
            }

            const nomeA = insumoA ? insumoA.nome : '';
            const nomeB = insumoB ? insumoB.nome : '';
            return nomeA.localeCompare(nomeB, 'pt-BR');
        });
    }

        linhas.forEach(row => {

            const p = parseFloat(row.querySelector('.f-preco').value);
            const pp = parseFloat(row.querySelector('.f-preco-promo').value) || 0;

        if (idStr) {
            const idx = insumos.findIndex(i => i.id === id);

    function renderInsumos() {
        tbInsumos.innerHTML = '';
        if (insumos.length === 0) {
            tbInsumos.innerHTML = '<tr><td colspan="5" class="empty-msg">Nenhum insumo cadastrado ainda.</td></tr>';
            return;
        }

        const termoBusca = document.getElementById('busca-insumo') ? document.getElementById('busca-insumo').value.toLowerCase().trim() : '';
        const insumosFiltrados = ordenarInsumos(insumos.filter(i => i.nome.toLowerCase().includes(termoBusca)));

        if (insumosFiltrados.length === 0) {
            tbInsumos.innerHTML = '<tr><td colspan="5" class="empty-msg">Nenhum insumo encontrado.</td></tr>';
            return;
        }

        insumosFiltrados.forEach(i => {
            if (!i.fornecedores) {
                i.fornecedores = [{ nome: 'Padrão', qtd: i.qtd || 1, preco: i.preco || 0 }];
            }

            const total = i.fornecedores.length;
            let maxCustoUnit = null;
            let minCustoUnit = null;

            if (total > 1) {
                const custosUnitarios = i.fornecedores.map(f => {
                    const precoAtivo = (f.precoPromo !== undefined && f.precoPromo !== null && f.precoPromo > 0) ? f.precoPromo : (f.preco || 0);
                    return precoAtivo / (f.qtd || 1);
                });
                maxCustoUnit = Math.max(...custosUnitarios);
                minCustoUnit = Math.min(...custosUnitarios);
            }

            const listaF = i.fornecedores.map(f => {
                const precoAtivo = (f.precoPromo !== undefined && f.precoPromo !== null && f.precoPromo > 0) ? f.precoPromo : (f.preco || 0);
                const custoUnit = precoAtivo / (f.qtd || 1);
                let badgeHtml = '';

                if (total > 1) {
                    if (custoUnit === maxCustoUnit) {
                        badgeHtml = '<span class="tag-max">MAIOR</span>';
                    } else if (custoUnit === minCustoUnit) {
                        badgeHtml = '<span class="tag-min">MENOR</span>';
                    }
                }

                let precoDisplay = `R$ ${f.preco.toFixed(2)}`;
                if (f.precoPromo !== undefined && f.precoPromo !== null && f.precoPromo > 0) {
                    precoDisplay = `<span style="text-decoration: line-through; opacity: 0.5;">R$ ${f.preco.toFixed(2)}</span> <span style="color: #fbbf24; font-weight: bold;">$ R$ ${f.precoPromo.toFixed(2)}</span>`;
                }

                return `${f.nome}: ${precoDisplay} / ${f.qtd}${i.unidade} ${badgeHtml}`;
            }).join('<br>');

            const maior = obterMaiorPrecoInsumo(i);

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td data-label="Nome"><strong>${i.nome}</strong></td>
                <td data-label="Fornecedores" style="font-size: 0.85rem; color: var(--text-muted);">${listaF}</td>
                <td data-label="Maior Preço">R$ ${maior.preco.toFixed(2)}</td>
                <td data-label="Custo Unit.">R$ ${maior.custoUnit.toFixed(4)} / ${i.unidade}</td>
                <td data-label="Ações">
                    <button class="btn-edit" onclick="editarInsumo(${i.id})">Editar</button>
                    <button class="btn-danger" onclick="excluirInsumo(${i.id})">Excluir</button>
                </td>
            `;
            tbInsumos.appendChild(tr);
        });
    }

    function atualizarQtdReceita(index, novaQtd) {
        const qtdNum = parseFloat(novaQtd) || 0;
        receitaAtual[index].qtd = qtdNum;

        const insumo = insumos.find(i => i.id === receitaAtual[index].insumoId);
        if (insumo) {
            const dadosPreco = obterMaiorPrecoInsumo(insumo);
            const custoDose = dadosPreco.custoUnit * qtdNum;
            const costCell = document.getElementById(`cost-${index}`);
            if (costCell) {
                costCell.innerText = `R$ ${custoDose.toFixed(2)}`;
            }
        }
        calcularTotais();
    }

    inputMarkup.addEventListener('input', calcularTotais);

    function calcularTotais() {
        let cmvTotal = 0;
        receitaAtual.forEach(item => {
            const insumo = insumos.find(i => i.id === item.insumoId);
            if (insumo) {
                const dadosPreco = obterMaiorPrecoInsumo(insumo);
                cmvTotal += dadosPreco.custoUnit * item.qtd;
            }
        });

        const markup = parseFloat(inputMarkup.value) || 0;
        const precoVenda = cmvTotal * markup;
        const cmvPct = precoVenda > 0 ? (cmvTotal / precoVenda) * 100 : 0;

        document.getElementById('res-cmv-rs').innerText = `R$ ${cmvTotal.toFixed(2)}`;
        document.getElementById('res-preco-venda').innerText = `R$ ${precoVenda.toFixed(2)}`;
        document.getElementById('res-cmv-pct').innerText = `${cmvPct.toFixed(1)}%`;

        return { cmvTotal, precoVenda, cmvPct, markup };
    }

        const novoDrinque = {

    function excluirDrinque(id) {
        const drinque = drinques.find(d => d.id === id);
        const nome = drinque ? `"${drinque.nome}"` : 'este drinque';
        confirmar(`Tem certeza que deseja excluir ${nome}?`, () => {

            salvarStorage();
            renderDrinquesSalvos();
        });

    function renderDrinquesSalvos() {
        listaDrinquesSalvos.innerHTML = '';

        if (drinques.length === 0) {
            listaDrinquesSalvos.innerHTML = '<div class="empty-msg">Nenhum drinque salvo até o momento.</div>';
            return;
        }

        drinques.forEach(d => {
            let cmvAtualizado = 0;
            let linhasInsumos = '';

            ordenarListaReceita(d.receita);

            d.receita.forEach(item => {
                const insumo = insumos.find(i => i.id === item.insumoId);
                if (insumo) {
                    const dadosPreco = obterMaiorPrecoInsumo(insumo);
                    const custoDose = dadosPreco.custoUnit * item.qtd;
                    cmvAtualizado += custoDose;
                    linhasInsumos += `<li>${insumo.nome}: ${item.qtd} ${insumo.unidade} (R$ ${custoDose.toFixed(2)})</li>`;
                } else {
                    linhasInsumos += `<li style="color:var(--danger)">Insumo removido (${item.qtd})</li>`;
                }
            });

            const markup = d.markup || 4.0;
            const precoVendaAtualizado = cmvAtualizado * markup;
            const cmvPctAtualizado = precoVendaAtualizado > 0 ? (cmvAtualizado / precoVendaAtualizado) * 100 : 0;

            const div = document.createElement('div');
            div.className = 'drink-card';

                        <button class="btn-danger" onclick="excluirDrinque(${d.id})">Excluir</button>
                    </div>
                </div>
                <div class="drink-metrics">
                    <span>CMV Máximo: <strong>R$ ${cmvAtualizado.toFixed(2)}</strong></span>
                    <span>Markup: <strong>${markup}x</strong></span>
                    <span>Preço Sugerido: <strong>R$ ${precoVendaAtualizado.toFixed(2)}</strong></span>
                    <span>CMV %: <strong>${cmvPctAtualizado.toFixed(1)}%</strong></span>
                </div>
                <div style="font-size: 0.85rem; color: var(--text-muted);">
                    <strong>Insumos & Doses (Base Preço Teto):</strong>

    async function salvarStorage() {
        if (!currentUser) return;
        
        // Backup local de segurança
        localStorage.setItem('insumos_db', JSON.stringify(insumos));
        localStorage.setItem('drinques_db', JSON.stringify(drinques));

        try {
            await db.collection('users').doc(currentUser.uid).set({
                insumos: insumos,
                drinques: drinques,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        } catch (err) {
            console.error('Erro ao salvar no Firestore:', err);
            mostrarNotificacao('Salvo apenas localmente (erro de conexão).', 'danger');
        }
    }

        if (insumos.length === 0 && drinques.length === 0) {
            mostrarNotificacao('Nenhum dado cadastrado para exportar!', 'danger');
            return;
        }
        const backupData = { insumos: insumos, drinques: drinques };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `backup_cmv_drinques_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    });

    fileImportar.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const dadosImportados = JSON.parse(event.target.result);
                if (dadosImportados.insumos || dadosImportados.drinques) {
                    insumos = dadosImportados.insumos || [];
                    drinques = dadosImportados.drinques || [];
                }
                salvarStorage();
                renderInsumos();
                atualizarSelectInsumos();
                recalcularReceita();
                renderDrinquesSalvos();
                mostrarNotificacao('Backup importado com sucesso!');
            } catch (err) {
                mostrarNotificacao('Erro ao ler o arquivo de backup.', 'danger');
            }
        };
        reader.readAsText(file);
        e.target.value = '';
    });

    function exportarInsumosCSV() {
        if (insumos.length === 0) {
            mostrarNotificacao('Nenhum insumo cadastrado para exportar!', 'danger');
            return;
        }

        // Cabeçalhos do CSV
        let csvContent = "Insumo;Unidade Padronizada;Fornecedor;Qtd Embalagem;Preço Embalagem (R$);Preço Promoção (R$);Custo Unitário (R$);Última Alt. Valor\r\n";

        insumos.forEach(i => {
            const fornecedores = i.fornecedores || [];
            fornecedores.forEach(f => {
                const precoAtivo = (f.precoPromo !== undefined && f.precoPromo !== null && f.precoPromo > 0) ? f.precoPromo : (f.preco || 0);
                const custoUnit = precoAtivo / (f.qtd || 1);
                
                const dataFormatada = f.data ? formatarDataParaExibicao(f.data) : '-';

                const nomeInsumo = i.nome.replace(/"/g, '""');
                const unidade = i.unidade.replace(/"/g, '""');
                const nomeFornecedor = f.nome.replace(/"/g, '""');

                // Formatação brasileira compatível nativamente com Excel
                const qtdFmt = f.qtd.toString().replace('.', ',');
                const precoFmt = f.preco.toFixed(2).replace('.', ',');
                const promoFmt = (f.precoPromo !== undefined && f.precoPromo !== null && f.precoPromo > 0) ? f.precoPromo.toFixed(2).replace('.', ',') : '';
                const custoFmt = custoUnit.toFixed(4).replace('.', ',');

                csvContent += `"${nomeInsumo}";"${unidade}";"${nomeFornecedor}";${qtdFmt};${precoFmt};"${promoFmt}";${custoFmt};"${dataFormatada}"\r\n`;
            });
        });

        // BOM UTF-8 para Excel reconhecer acentuação em português
        const blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", url);
        downloadAnchor.setAttribute("download", `planilha_insumos_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        mostrarNotificacao('Planilha exportada com sucesso!');
    }

    function exportarDrinques() {
        if (drinques.length === 0) {
            mostrarNotificacao('Nenhum drinque cadastrado para exportar!', 'danger');
            return;
        }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(drinques, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `backup_drinques_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        mostrarNotificacao('Drinques exportados com sucesso!');
    }

    document.getElementById('file-importar-drinques').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const dadosImportados = JSON.parse(event.target.result);
                let listaNovosDrinques = [];
                if (Array.isArray(dadosImportados)) {
                    listaNovosDrinques = dadosImportados;
                } else if (dadosImportados.drinques && Array.isArray(dadosImportados.drinques)) {
                    listaNovosDrinques = dadosImportados.drinques;
                } else {
                    mostrarNotificacao('Arquivo inválido. Formato de drinques não reconhecido.', 'danger');
                    return;
                }

                if (listaNovosDrinques.length === 0) {
                    mostrarNotificacao('Nenhum drinque encontrado no arquivo.', 'danger');
                    return;
                }

                let adicionados = 0;
                let atualizados = 0;
                listaNovosDrinques.forEach(novo => {
                    const index = drinques.findIndex(d => d.id === novo.id);
                    if (index > -1) {
                        drinques[index] = novo;
                        atualizados++;
                    } else {
                        drinques.push(novo);
                        adicionados++;
                    }
                });

                salvarStorage();
                renderDrinquesSalvos();
                mostrarNotificacao(`Importado: ${adicionados} novos, ${atualizados} atualizados!`);
            } catch (err) {
                mostrarNotificacao('Erro ao ler o arquivo de drinques.', 'danger');
            }
        };
        reader.readAsText(file);
        e.target.value = '';
    });

    init();
</script>
